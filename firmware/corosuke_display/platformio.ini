; コロ助 胴体ディスプレイ / Korosuke Body Display
; ボード: Sunton ESP32-4827S043 (CYD 4.3" 480x272 RGBパラレル, 抵抗膜タッチ XPT2046)
;   SoC   : ESP32-S3-WROOM-1 N16R8 (16MB flash / 8MB Octal PSRAM)
;   Panel : 480x272 16bit RGBパラレル (ST7262系, init不要のTTL-RGB)
;   Touch : XPT2046 (抵抗膜, SPI ※SDと共有バス)
;   USB-C : CH340C UART bridge (VID_1A86) → Windows実機では COM16 / RDK Linuxでは /dev/ttyUSB*
;
; ※ USB CDC(ネイティブ)は使わない。Serial は UART0=CH340 に出す(CDC_ON_BOOT=0 のデフォルト)。
;   これにより PC/RDK からの映像・制御は CH340 の1本で完結する。
[env:esp32-4827S043]
platform = espressif32@6.9.0        ; 目ファームと同一に固定(キャッシュ破損回避の実績構成)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM16                 ; CH340 (VID_1A86). 変わったら要修正
monitor_port = COM16
board_build.arduino.memory_type = qio_opi   ; N16R8 = Octal PSRAM
board_build.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
lib_deps =
    lovyan03/LovyanGFX@1.1.16       ; 目ファームと同一固定
    bitbank2/JPEGDEC@^1.8.2         ; 高速JPEGデコード(tjpgdの2-3倍, S3 SIMD)。M2の描画高速化

; ---- 1732S019 コンボ: お腹画面 + 目GC9A01x2 + 腕サーボx2 + 撫でタッチ ----
; devkit目基板(corosuke_eyes)の置き換え用。コマンド体系は同一(emo/gaze/blink/wink/idle/arm)。
; コマンドはUSB映像と同じCH340で「A5 5B|len|テキスト」フレーム(display_send.pyが/eyecmdを転送)。
; ピンはヘッダ空きピン調査に基づき -D で注入(下記EYE_*/ARM_*)。
[env:esp32-1732S019-combo]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DBOARD_1732S019
    -DCOMBO_EYES
    ; 目GC9A01x2: P1列(IO4..7,15,16が物理連続。3V3/GNDもP1端で片側完結)
    -DEYE_SCK=4
    -DEYE_MOSI=5
    -DEYE_DC=6
    -DEYE_RST=7
    -DEYE_CS_L=15
    -DEYE_CS_R=16
    ; サーボ: P2列 IO41/42(JTAGデフォルト=ブート時パルス無し→起動ピクつき防止)
    ; ※IO45はストラッピングピンなので使用禁止。サーボ電源は必ず外部5V(基板5Vは1A/ダイオード降下)
    -DARM_L_PIN=41
    -DARM_R_PIN=42
    ; 撫でタッチ: IO2(P2-12, S3タッチ対応T2)。パッド未配線だと誤検知するため既定は無効(-1)。
    ; 導電パッドをIO2に繋いだら =2 に変えて再ビルド
    -DPET_TOUCH_PIN=-1
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    bitbank2/JPEGDEC@^1.8.2

; ---- Sunton ESP32-1732S019 (1.9" 170x320 ST7789 SPI, タッチ無し) ----
; 利点: SPIパネルなのでGPIOが約20本ヘッダに出ている(目/サーボ増設向き)。
; USBは同じCH340(VID_1A86)。プロトコル/センダは共通、--width 320 --height 170 で送る。
[env:esp32-1732S019]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM7                  ; このWindows機ではCOM7 (CH340)。変わったら要修正
monitor_port = COM7
board_build.arduino.memory_type = qio_opi   ; N16R8想定(PSRAM無し変種でもmalloc保険で動く)
board_build.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DBOARD_1732S019                ; main.cppのボード切替
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    bitbank2/JPEGDEC@^1.8.2
