; コロ助 目コプロセッサ (ESP32-S3 N16R8 + GC9A01 x2)
; 実機: ESP32-S3 DevKit (USB-C x2, CH343 UART側 = COM7)
[env:esp32s3]
platform = espressif32@6.9.0   ; 最新指定だとローカルキャッシュ破損でManifestErrorが出るため既存版に固定
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi   ; N16R8 = Octal PSRAM
board_build.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
