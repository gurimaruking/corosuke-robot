; ミニコロ助 — ESP32-S3 単体 / 完全オフライン
; ベースボード: Elecrow ESP Terminal 3.5" (ESP32-S3, 16MB Flash / 8MB OPI PSRAM,
;              320x480 ILI9488 SPI, 静電容量タッチ FT6236, OV2640 同梱)
;
; Ph1 スコープ: 単画面に左右2つの丸い目を描き、表情8種＋まばたき＋視線を出す。
;              音声(MAX98357A/I2S)・タッチ・カメラ顔検出は後続フェーズ。

[env:elecrow-esp-terminal-35]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16MB flash(QIO) + 8MB PSRAM(OPI) ---
board_build.flash_size          = 16MB
board_build.partitions          = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
  -DBOARD_HAS_PSRAM
  -DLGFX_USE_V1
  -DARDUINO_USB_CDC_ON_BOOT=1        ; USB-CDCでシリアルコマンド(emo/gaze/...)を受ける

lib_deps =
  lovyan03/LovyanGFX@^1.1.16

monitor_speed = 115200
upload_speed  = 921600
